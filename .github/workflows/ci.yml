name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate infrastructure controllers
        run: |
          kustomize build infrastructure/controllers | \
            kubeconform -strict -summary \
              -skip HelmRelease,HelmRepository,Kustomization

      - name: Validate apps
        run: |
          for dir in apps/*/; do
            if [ -f "$dir/kustomization.yaml" ]; then
              echo "=== $dir ==="
              kustomize build "$dir" | \
                kubeconform -strict -summary \
                  -skip HelmRelease,HelmRepository,Kustomization,GitRepository
            fi
          done

      - name: Validate cluster overlays
        run: |
          for dir in clusters/*/; do
            if [ -f "$dir/kustomization.yaml" ] || [ -f "$dir/cluster-settings.yaml" ]; then
              echo "=== $dir ==="
              for f in "$dir"*.yaml; do
                kubeconform -strict -summary \
                  -skip Kustomization,GitRepository "$f"
              done
            fi
          done

      - name: Kustomize build check (all dirs)
        run: |
          for dir in infrastructure/controllers infrastructure/configs infrastructure/secrets; do
            echo "=== $dir ==="
            kustomize build "$dir" > /dev/null
          done

      - name: YAML lint
        run: |
          pip install yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' \
            infrastructure/ apps/ clusters/
