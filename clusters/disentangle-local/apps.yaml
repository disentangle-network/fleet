  name: disentangle-local-apps
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/disentangle-local
  prune: true
  dependsOn:
    - name: disentangle-local-infrastructure
